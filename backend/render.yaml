services:
  - type: web
    name: ecommerce-backend-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: LOGIN_EMAIL_COOLDOWN_MINUTES
        value: 15
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

